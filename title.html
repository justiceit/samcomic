<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Samcomic</title>
  <link rel="icon" href="logo/sc_logo.ico">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Noto+Serif+JP:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="manga-app" data-theme="light" id="app">

    <!-- NAVBAR -->
    <header class="top-bar">
      <a class="site-logo" href="/">
        <img src="logo/sc_logo.ico" alt="Samcomic logo" id="logoImg">
        <span class="site-logo-fallback" id="logoFallback">SC</span>
      </a>
      <nav class="nav-links">
        <a href="index.html">Trang chủ</a>
        <a href="comingsoon.html">Thể loại</a>
        <a href="comingsoon.html">Top manga</a>
        <a href="comingsoon.html">Lịch sử</a>
      </nav>
      <button class="toggle-btn" id="toggleBtn" aria-label="Chuyển chế độ sáng/tối">
        <i class="ti ti-sun icon-sun" aria-hidden="true"></i>
        <i class="ti ti-moon icon-moon" aria-hidden="true"></i>
      </button>
    </header>

    <!-- HERO -->
    <section class="hero">
      <div class="hero-cover">
        <div class="cover-art" id="coverArt">
          <div class="cover-spine"></div>
          <div class="cover-kanji-big" id="coverKanji"></div>
          <div class="cover-sub" id="coverSub"></div>
        </div>
      </div>
      <div class="hero-info">
        <h1 class="manga-title" id="mangaTitle"></h1>
        <p class="manga-alt" id="mangaAlt"></p>
        <div class="tags" id="mangaTags"></div>
        <div class="meta-grid">
          <div class="meta-item">
            <span class="meta-label">Tác giả</span>
            <span class="meta-val" id="metaAuthor"></span>
          </div>
          <div class="meta-item">
            <span class="meta-label">Họa sĩ</span>
            <span class="meta-val" id="metaArtist"></span>
          </div>
          <div class="meta-item">
            <span class="meta-label">Nhà xuất bản</span>
            <span class="meta-val" id="metaPublisher"></span>
          </div>
          <div class="meta-item">
            <span class="meta-label">Trạng thái</span>
            <span class="status-badge" id="metaStatus">
              <span class="status-dot"></span><span id="metaStatusText"></span>
            </span>
          </div>
          <div class="meta-item">
            <span class="meta-label">Số chương</span>
            <span class="meta-val" id="metaChapters"></span>
          </div>
          <div class="meta-item">
            <span class="meta-label">Năm phát hành</span>
            <span class="meta-val" id="metaYear"></span>
          </div>
        </div>
        <p class="desc-text" id="mangaDesc"></p>
        <div class="btn-row">
          <button class="btn-p"><i class="ti ti-player-play" aria-hidden="true"></i> Đọc ngay</button>
          <button class="btn-o"><i class="ti ti-bookmark" aria-hidden="true"></i> Theo dõi</button>
          <button class="btn-o"><i class="ti ti-share" aria-hidden="true"></i> Chia sẻ</button>
        </div>
      </div>
    </section>

    <!-- STATS BAR -->
    <div class="stats-bar">
      <div class="stat"><i class="ti ti-book-2" aria-hidden="true"></i><b id="statChapters"></b> chương</div>
      <div class="stat"><i class="ti ti-eye" aria-hidden="true"></i><b id="statViews"></b> lượt xem</div>
      <div class="stat"><i class="ti ti-heart" aria-hidden="true"></i><b id="statFavorites"></b> yêu thích</div>
      <div class="stat"><i class="ti ti-star" aria-hidden="true"></i><b id="statRating"></b> / 10</div>
      <div class="stat"><i class="ti ti-clock" aria-hidden="true"></i>Cập nhật <b id="statUpdated"></b></div>
    </div>

    <!-- CHAPTER LIST -->
    <section class="chapters-section">
      <div class="sec-header">
        <span class="sec-title">Danh sách chương</span>
        <div class="search-row">
          <div class="search-box">
            <i class="ti ti-search" aria-hidden="true"></i>
            <input type="text" placeholder="Tìm chương..." id="chapSearch">
          </div>
          <button class="sort-btn" id="sortBtn">
            <i class="ti ti-arrows-sort" aria-hidden="true"></i>
            <span id="sortLabel">Mới nhất</span>
          </button>
        </div>
      </div>
      <div class="chapter-list" id="chapList"></div>
    </section>

  </div>

  <script src="js/script.js"></script>
</body>
</html>
